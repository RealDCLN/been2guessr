[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "been2guessr"
version = "0.1.0"
description = "Turn a BeenEverywhere travel map into a GeoGuessr custom map."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "been2guessr contributors" }]
keywords = ["geoguessr", "beeneverywhere", "streetview", "maps", "travel"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "build>=1.2",
]

[project.scripts]
been2guessr = "been2guessr.cli:main"

[project.urls]
Homepage = "https://github.com/RealDCLN/been2guessr"
Issues = "https://github.com/RealDCLN/been2guessr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/been2guessr"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
