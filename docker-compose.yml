services:
  been2guessr:
    build: .
    image: been2guessr:latest
    ports:
      - "8000:8000"
    environment:
      MAX_CONCURRENT_JOBS: "2"
      MAX_BUILD_LOCATIONS: "2000"
      JOB_TTL_SECONDS: "3600"
      RATE_LIMIT_JOBS: "5"
      RATE_LIMIT_WINDOW: "3600"
      # TRUST_PROXY: "true"
    restart: unless-stopped
    # Jobs are held in memory; keep one worker so downloads stay available.
    command: ["been2guessr", "serve", "--host", "0.0.0.0", "--port", "8000"]
